[package]
name = "rustcorder"
version = "0.1.0"
edition = "2021"

# Build requirement: libasound2-dev must be installed (sudo apt install libasound2-dev)

[[bin]]
name = "rustcorder"
path = "src/main.rs"

[dependencies]
alsa        = "0.9"
ratatui     = { version = "0.29", features = ["crossterm"] }
crossterm   = "0.28"
signal-hook = "0.3"
anyhow      = "1"
dotenvy     = "0.15"
