<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rustcorder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ccc;
      font-family: 'Georgia', serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Status bar ───────────────────────────────────── */
    #status-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 6px 14px;
      background: #1c1c1c;
      border-bottom: 1px solid #333;
      font-family: monospace;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
    }

    #status-bar.recording { background: #3a0000; border-bottom-color: #c00; }
    #status-bar.playing   { background: #002200; border-bottom-color: #060; }
    #status-bar.standby   { background: #1c1400; border-bottom-color: #550; }

    .sb-mode {
      font-weight: bold;
      min-width: 130px;
    }
    .mode-standby   { color: #cc0; }
    .mode-playing   { color: #4c4; }
    .mode-recording { color: #f44; }
    .mode-setup     { color: #fa4; }
    .mode-micerror  { color: #f44; }
    .mode-fatal     { color: #f44; }
    .mode-init      { color: #666; }

    .sb-sep { color: #444; }

    .sb-book  { color: #fff; font-weight: bold; }
    .sb-meta  { color: #aaa; }
    .sb-time  { color: #88f; font-variant-numeric: tabular-nums; min-width: 80px; }

    .sb-vu-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    .sb-vu-bar {
      height: 10px;
      flex: 1;
      max-width: 180px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
    }
    .sb-vu-fill {
      height: 100%;
      width: 0%;
      background: #2a2;
      transition: width 60ms linear;
    }
    .sb-vu-fill.yellow { background: #aa4; }
    .sb-vu-fill.red    { background: #a22; }
    .sb-db { color: #888; font-size: 11px; min-width: 54px; }

    /* ── EPUB viewer ──────────────────────────────────── */
    #viewer {
      flex: 1;
      min-height: 0;
      background: #1a1714;
    }

    /* epub.js injects an iframe; make it fill the container */
    #viewer iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
    }

    /* ── PDF viewer ───────────────────────────────────── */
    #pdf-viewer {
      display: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: #1a1714;
      align-items: center;
      flex-direction: column;
    }
    #pdf-viewer.visible { display: flex; }

    #pdf-viewer canvas {
      display: block;
      max-width: 100%;
      margin: 0 auto 8px;
    }

    /* ── No-epub placeholder ──────────────────────────── */
    #no-epub {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: #555;
      font-family: monospace;
    }
    #no-epub.visible { display: flex; }

    /* ── Key-hint footer ──────────────────────────────── */
    #footer {
      flex-shrink: 0;
      padding: 3px 14px;
      background: #161616;
      border-top: 1px solid #2a2a2a;
      font-family: monospace;
      font-size: 11px;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    /* ── Connecting overlay ───────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center;
      font-family: monospace; font-size: 18px; color: #888;
      z-index: 100;
    }
    #overlay.visible { display: flex; }
  </style>
</head>
<body>

<div id="status-bar">
  <span class="sb-mode mode-init" id="sb-mode">[ CONNECTING ]</span>
  <span class="sb-sep">│</span>
  <span class="sb-book" id="sb-book">—</span>
  <span class="sb-sep">│</span>
  <span class="sb-meta" id="sb-meta">Ch — · Part —</span>
  <span class="sb-sep">│</span>
  <span class="sb-time"  id="sb-time">—:——:——</span>
  <span class="sb-sep">│</span>
  <div class="sb-vu-wrap">
    <div class="sb-vu-bar"><div class="sb-vu-fill" id="sb-vu-fill"></div></div>
    <span class="sb-db" id="sb-db">— dBFS</span>
  </div>
</div>

<div id="viewer"></div>
<div id="pdf-viewer"></div>
<div id="no-epub"><span>No book loaded</span><span id="no-epub-hint"></span></div>
<div id="footer" id="footer"></div>
<div id="overlay">Disconnected — reconnecting…</div>

<script src="/jszip.min.js"></script>
<script src="/epub.min.js"></script>
<script src="/pdf.min.js"></script>
<script>
'use strict';

// ── App state ──────────────────────────────────────────────────────────────

let currentMode     = 'Init';
let rendition       = null;
let bookLoaded      = false;
let currentEpubPath = null;
let currentPdfPath  = null;
let pdfLoadingPath  = null;
let pdfDoc          = null;   // cached pdfjsLib document
let pdfZoom         = 1.5;    // scale multiplier relative to fit-width
let pdfRenderGen    = 0;      // incremented on each render to abort stale renders

// ── WebSocket ──────────────────────────────────────────────────────────────

const overlay = document.getElementById('overlay');
let ws;

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => { overlay.classList.remove('visible'); };

  ws.onmessage = e => {
    let state;
    try { state = JSON.parse(e.data); } catch { return; }
    currentMode = state.mode || 'Init';
    updateStatusBar(state);
    updateFooter(state);
    handleStateBook(state);
  };

  ws.onclose = () => {
    overlay.classList.add('visible');
    overlay.textContent = 'Disconnected — reconnecting…';
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();
}

// Fetch state immediately on load so the EPUB starts loading before the
// WebSocket handshake completes.
fetch('/state')
  .then(r => r.json())
  .then(state => {
    currentMode = state.mode || 'Init';
    updateStatusBar(state);
    updateFooter(state);
    handleStateBook(state);
  })
  .catch(() => {});

connect();

// ── Keyboard bindings ──────────────────────────────────────────────────────
//
// These mirror the TUI key map exactly.  Keys are consumed here and sent as
// action JSON; the browser's own scroll/etc. behaviour is suppressed.

const ABSORB = new Set(['Space', 'Enter', 'KeyP', 'KeyJ', 'KeyK', 'KeyL',
                        'KeyN', 'Escape', 'ArrowLeft', 'ArrowRight',
                        'KeyE', 'KeyR', 'KeyQ', 'Minus', 'Equal']);

document.addEventListener('keydown', e => {
  // Allow normal input when focus is inside a text field.
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  const key = e.code;
  if (ABSORB.has(key)) e.preventDefault();

  // ← / → scroll the EPUB directly in the browser.
  if (key === 'ArrowRight') { if (rendition) rendition.next(); return; }
  if (key === 'ArrowLeft')  { if (rendition) rendition.prev(); return; }

  // - / _ → zoom out PDF;  + / = → zoom in PDF (active whenever a PDF is shown).
  if (currentPdfPath && key === 'Minus') { pdfZoom = Math.max(0.5, pdfZoom - 0.25); renderPdfPages(); return; }
  if (currentPdfPath && key === 'Equal') { pdfZoom = Math.min(4.0, pdfZoom + 0.25); renderPdfPages(); return; }

  switch (currentMode) {
    case 'Standby':
      if (key === 'Space' || key === 'Enter')      send({ action: 'start' });
      else if (key === 'KeyL')                     send({ action: 'play' });
      else if (key === 'KeyJ')                     send({ action: 'jump_back' });
      else if (key === 'KeyK')                     send({ action: 'jump_forward' });
      else if (key === 'KeyN')                     send({ action: 'next_chapter' });
      else if (key === 'KeyE')                     send({ action: 'edit_session' });
      else if (key === 'KeyR')                     send({ action: 'retry_mic' });
      else if (key === 'KeyQ' || key === 'Escape') send({ action: 'quit' });
      break;

    case 'Playing':
      if (key === 'Space' || key === 'Enter') send({ action: 'start' }); // punch in
      else if (key === 'KeyL')                send({ action: 'pause' });
      else if (key === 'KeyP')                send({ action: 'punch' });
      else if (key === 'KeyJ')                send({ action: 'jump_back' });
      else if (key === 'KeyK')                send({ action: 'jump_forward' });
      break;

    case 'Recording':
      if (key === 'Space' || key === 'Enter') send({ action: 'stop' });
      else if (key === 'KeyP')                send({ action: 'punch' });
      break;

    case 'MicError':
      if (key === 'KeyR') send({ action: 'retry_mic' });
      else if (key === 'KeyQ') send({ action: 'quit' });
      break;

    case 'Fatal':
      if (key === 'KeyQ' || key === 'Escape') send({ action: 'quit' });
      break;
  }
});

// ── EPUB loading ───────────────────────────────────────────────────────────

function loadEpub() {
  const viewer = document.getElementById('viewer');
  const noEpub = document.getElementById('no-epub');

  noEpub.classList.remove('visible');
  viewer.style.display = 'block';

  const book = ePub('/book/');
  rendition = book.renderTo('viewer', {
    flow:   'scrolled',
    width:  '100%',
    height: '100%',
  });

  rendition.hooks.content.register(contents => {
    contents.addStylesheetCss(`
      body {
        background: #1a1714 !important;
        color: #d4cfc8 !important;
        font-size: 1.05em;
        line-height: 1.7;
        max-width: 680px;
        margin: 0 auto;
        padding: 24px 32px;
      }
    `);
    // Forward keydown events from inside the iframe to the parent document.
    // Arrow keys are handled here directly to avoid the iframe's native scroll
    // fighting with rendition.next()/prev().
    contents.document.addEventListener('keydown', e => {
      if (e.code === 'ArrowRight') { e.preventDefault(); if (rendition) rendition.next(); return; }
      if (e.code === 'ArrowLeft')  { e.preventDefault(); if (rendition) rendition.prev(); return; }
      if (e.code === 'Space') e.preventDefault();
      document.dispatchEvent(new KeyboardEvent('keydown', {
        code: e.code, key: e.key, bubbles: true,
        shiftKey: e.shiftKey, ctrlKey: e.ctrlKey, altKey: e.altKey,
      }));
    });
  });

  // Restore saved position from localStorage (keyed by epub path).
  const savedCfi = localStorage.getItem('epub_pos:' + currentEpubPath);
  rendition.display(savedCfi || undefined).then(() => {
    bookLoaded = true;
  }).catch(err => console.warn('epub display error:', err));

  // Save position to localStorage when the user scrolls.
  rendition.on('relocated', location => {
    const cfi = location?.start?.cfi;
    if (!cfi) return;
    localStorage.setItem('epub_pos:' + currentEpubPath, cfi);
  });
}

function handleStateBook(state) {
  const viewer    = document.getElementById('viewer');
  const pdfViewer = document.getElementById('pdf-viewer');
  const noEpub    = document.getElementById('no-epub');

  if (state.epub_path) {
    // ── EPUB path (unchanged behavior) ──────────────────────────────────────
    pdfViewer.classList.remove('visible');
    noEpub.classList.remove('visible');
    currentPdfPath = null;
    pdfLoadingPath = null;

    if (state.epub_path !== currentEpubPath) {
      currentEpubPath = state.epub_path;
      bookLoaded = false;
      if (rendition) { try { rendition.destroy(); } catch {} }
      viewer.innerHTML = '';
      viewer.style.display = 'block';
      loadEpub();
    }
    return;
  }

  // No EPUB — hide EPUB viewer.
  viewer.style.display = 'none';
  if (rendition) { try { rendition.destroy(); } catch {} rendition = null; }
  bookLoaded = false;
  currentEpubPath = null;
  pdfDoc = null;

  if (state.pdf_path) {
    // ── PDF path ─────────────────────────────────────────────────────────────
    noEpub.classList.remove('visible');

    if (state.pdf_path !== currentPdfPath) {
      currentPdfPath = state.pdf_path;
      pdfViewer.innerHTML = '';
      pdfViewer.classList.add('visible');
      loadPdf();
    }
    return;
  }

  // ── Neither — show placeholder ────────────────────────────────────────────
  pdfViewer.classList.remove('visible');
  currentPdfPath = null;
  pdfLoadingPath = null;
  noEpub.classList.add('visible');
  document.getElementById('no-epub-hint').textContent =
    state.book ? `(add a .epub or .pdf file to the ${state.book}/ directory)` : '';
}

async function loadPdf() {
  const pathAtStart = currentPdfPath;
  pdfLoadingPath = pathAtStart;
  pdfDoc = null;

  pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.js';

  try {
    pdfDoc = await pdfjsLib.getDocument('/pdf').promise;
  } catch (err) {
    console.warn('PDF load error:', err);
    return;
  }

  // Bail if the book changed while we were fetching.
  if (pdfLoadingPath !== pathAtStart) return;

  await renderPdfPages();
}

async function renderPdfPages() {
  if (!pdfDoc) return;

  const gen       = ++pdfRenderGen;
  const pdfViewer = document.getElementById('pdf-viewer');
  pdfViewer.innerHTML = '';

  const dpr = window.devicePixelRatio || 1;

  for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
    if (pdfRenderGen !== gen) return; // aborted by a newer render

    const page     = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1 });

    // Fit to container width, then apply the user's zoom multiplier.
    const cssW   = (pdfViewer.clientWidth || 800) * pdfZoom;
    const scale  = (cssW / viewport.width) * dpr;
    const vp     = page.getViewport({ scale });

    const canvas = document.createElement('canvas');
    const ctx    = canvas.getContext('2d');
    canvas.width        = vp.width;
    canvas.height       = vp.height;
    canvas.style.width  = (vp.width  / dpr) + 'px';
    canvas.style.height = (vp.height / dpr) + 'px';

    pdfViewer.appendChild(canvas);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
  }
}


// ── Helpers ────────────────────────────────────────────────────────────────

function fmtMmSs(secs) {
  const total = Math.max(0, secs);
  const m   = Math.floor(total / 60);
  const s   = (total % 60).toFixed(1).padStart(4, '0');
  return `${String(m).padStart(2,'0')}:${s}`;
}

// ── Status bar ─────────────────────────────────────────────────────────────

const MODE_LABELS = {
  Standby:   '[ STANDBY ]',
  Playing:   '[ ▶ PLAYING ]',
  Recording: '[ ● RECORDING ]',
  Setup:     '[ SETUP ]',
  MicError:  '[ MIC ERROR ]',
  Fatal:     '[ FATAL ERROR ]',
  Init:      '[ CONNECTING ]',
};

function updateStatusBar(state) {
  const bar    = document.getElementById('status-bar');
  const sbMode = document.getElementById('sb-mode');
  const sbBook = document.getElementById('sb-book');
  const sbMeta = document.getElementById('sb-meta');
  const sbTime = document.getElementById('sb-time');
  const vuFill = document.getElementById('sb-vu-fill');
  const sbDb   = document.getElementById('sb-db');

  const mode = state.mode || 'Init';
  sbMode.textContent = MODE_LABELS[mode] || `[ ${mode.toUpperCase()} ]`;
  sbMode.className   = `sb-mode mode-${mode.toLowerCase()}`;

  bar.className = mode === 'Recording' ? 'recording'
                : mode === 'Playing'   ? 'playing'
                : mode === 'Standby'   ? 'standby' : '';

  sbBook.textContent = state.book || '—';
  sbMeta.textContent = `Ch ${String(state.chapter ?? '—').padStart(2,'0')} · Part ${String(state.part ?? '—').padStart(3,'0')}`;

  // Timeline position — always shown, live during Playing.
  const posSecs = state.timeline_pos_secs ?? 0;
  sbTime.textContent = fmtMmSs(posSecs);

  const db  = state.rms_dbfs ?? -100;
  const pct = Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
  vuFill.style.width = pct + '%';
  vuFill.className   = 'sb-vu-fill' + (db > -6 ? ' red' : db > -18 ? ' yellow' : '');
  sbDb.textContent   = db > -99 ? `${db.toFixed(1)} dB` : '— dBFS';
}

// ── Footer hint bar ────────────────────────────────────────────────────────

function updateFooter(state) {
  document.getElementById('footer').textContent = state.footer_hints || '';
}
</script>
</body>
</html>
